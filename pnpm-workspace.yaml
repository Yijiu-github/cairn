# pnpm 工作区配置 + 依赖版本统一管理（catalogs）
# 文档：https://pnpm.io/workspaces / https://pnpm.io/catalogs
#
# 维护规则：
#   - 跨包共享、需要同步升级的依赖才放进 catalog
#   - 子包通过 "catalog:" 引用版本，例：  "typescript": "catalog:"
#   - 升级单一版本只需在此处改一处，整个 monorepo 同步

packages:
  - "apps/*"
  - "packages/*"

# ============================================================================
# 默认 catalog —— 子包用 "catalog:" 引用
# ============================================================================
catalog:
  # --- 运行时与基础工具链 ---
  typescript: ^5.7.2
  tsx: ^4.19.2
  "@types/node": ^22.10.2

  # --- 校验 / 契约 ---
  zod: ^3.24.1
  "@ts-rest/core": ^3.51.0
  "@ts-rest/fastify": ^3.51.0
  "@ts-rest/react-query": ^3.51.0
  "@asteasolutions/zod-to-openapi": ^7.3.0

  # --- 数据库 / ORM ---
  drizzle-orm: ^0.36.4
  drizzle-kit: ^0.28.1
  drizzle-zod: ^0.5.1
  better-sqlite3: ^12.10.0
  "@types/better-sqlite3": ^7.6.13
  pg: ^8.13.1
  "@types/pg": ^8.11.10

  # --- HTTP / WebSocket ---
  fastify: ^5.2.0
  "@fastify/cors": ^10.0.1
  "@fastify/sensible": ^6.0.2
  "@fastify/websocket": ^11.0.1
  ws: ^8.18.0
  "@types/ws": ^8.5.13

  # --- 日志 / 可观测 ---
  pino: ^9.5.0
  pino-pretty: ^13.0.0
  ulid: ^2.3.0

  # --- 前端核心（React / TanStack / Zustand） ---
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.1
  "@types/react-dom": ^19.0.2
  "@tanstack/react-router": ^1.87.0
  "@tanstack/router-devtools": ^1.87.0
  "@tanstack/react-query": ^5.62.7
  "@tanstack/react-query-devtools": ^5.62.7
  "@tanstack/react-table": ^8.20.6
  "@tanstack/react-virtual": ^3.11.2
  zustand: ^5.0.2
  react-error-boundary: ^4.1.2

  # --- UI 样式 / 组件依赖 ---
  tailwindcss: ^4.0.0-beta.7
  "@tailwindcss/vite": ^4.0.0-beta.7
  clsx: ^2.1.1
  class-variance-authority: ^0.7.1
  tailwind-merge: ^2.5.5
  lucide-react: ^0.468.0
  cmdk: ^1.0.4
  react-resizable-panels: ^2.1.7
  framer-motion: ^11.15.0

  # --- Radix Primitives（shadcn 底座，按需开包） ---
  "@radix-ui/react-dialog": ^1.1.4
  "@radix-ui/react-dropdown-menu": ^2.1.4
  "@radix-ui/react-popover": ^1.1.4
  "@radix-ui/react-slot": ^1.1.1
  "@radix-ui/react-tabs": ^1.1.2
  "@radix-ui/react-tooltip": ^1.1.6

  # --- Electron 桌面壳 ---
  electron: ^33.2.1
  electron-builder: ^25.1.8
  electron-vite: ^2.3.0
  electron-updater: ^6.3.9
  "@electron-toolkit/utils": ^4.0.0
  "@electron-toolkit/preload": ^3.0.1

  # --- 构建工具 ---
  vite: ^6.0.3
  esbuild: ^0.24.0

  # --- Lint / Format ---
  eslint: ^9.17.0
  "@eslint/js": ^9.17.0
  typescript-eslint: ^8.18.1
  eslint-plugin-import: ^2.31.0
  eslint-import-resolver-typescript: ^3.7.0
  eslint-plugin-unicorn: ^56.0.1
  eslint-config-prettier: ^9.1.0
  "@vitest/eslint-plugin": ^1.1.20
  globals: ^15.14.0
  prettier: ^3.4.2
  markdownlint-cli2: ^0.17.0

  # --- 测试 ---
  vitest: ^2.1.8
  "@vitest/coverage-v8": ^2.1.8
  playwright: ^1.49.1
  "@playwright/test": ^1.49.1
  msw: ^2.7.0

  # --- 提交 / Git hooks ---
  husky: ^9.1.7
  lint-staged: ^15.2.11
  "@commitlint/cli": ^19.6.1
  "@commitlint/config-conventional": ^19.6.0

  # --- 静态分析（dead code / 依赖审计） ---
  knip: ^5.41.0

# ============================================================================
# pnpm 行为
# ============================================================================
# 当依赖有内部 patch 时使用（如未来需要 patch 第三方包）
# patchedDependencies: {}

# 允许构建的 native 模块脚本（pnpm 10 起默认拒绝任意 postinstall）
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
