<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Cairn UI Visual Reference V1 - Artifact Detail</title>
  <desc id="desc">First visual reference for Cairn artifact review and provenance.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-weight: 760; fill: #0f172a; }
      .muted { fill: #64748b; }
      .soft { fill: #94a3b8; }
      .panel { fill: rgba(255,255,255,0.88); stroke: #dbe3ef; }
      .card { fill: #ffffff; stroke: #dbe3ef; }
      .hair { stroke: #e2e8f0; stroke-width: 1; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .purple { fill: #7c3aed; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="70" y="54" width="1300" height="852" rx="32" class="panel" filter="url(#shadow)"/>
  <rect x="70" y="54" width="1300" height="64" rx="32" fill="#ffffff"/>
  <rect x="70" y="86" width="1300" height="32" fill="#ffffff"/>
  <text x="106" y="94" class="ui title" font-size="22">Cairn</text>
  <text x="182" y="94" class="ui muted" font-size="14">Artifact Detail</text>

  <rect x="70" y="118" width="238" height="788" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="106" y="168" class="ui title" font-size="13">ARTIFACTS</text>
  <rect x="94" y="196" width="190" height="58" rx="16" fill="#eff6ff"/>
  <text x="116" y="226" class="ui blue" font-size="14" font-weight="760">patch.diff</text>
  <text x="116" y="246" class="ui muted" font-size="12">review pending</text>
  <rect x="94" y="270" width="190" height="58" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="116" y="300" class="ui title" font-size="14">test.log</text>
  <text x="116" y="320" class="ui green" font-size="12">accepted</text>
  <rect x="94" y="344" width="190" height="58" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="116" y="374" class="ui title" font-size="14">summary.md</text>
  <text x="116" y="394" class="ui muted" font-size="12">unreviewed</text>

  <rect x="308" y="118" width="722" height="788" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="352" y="168" class="ui title" font-size="30">patch.diff</text>
  <text x="352" y="200" class="ui muted" font-size="14">Generated by agent_run_8f3 · Task: Implement scheduler port · 3 minutes ago</text>
  <rect x="352" y="226" width="142" height="30" rx="10" fill="#fff7ed"/>
  <text x="374" y="246" class="ui amber" font-size="12" font-weight="760">Review pending</text>
  <rect x="506" y="226" width="112" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="528" y="246" class="ui muted" font-size="12">run-local</text>
  <rect x="630" y="226" width="124" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="652" y="246" class="ui muted" font-size="12">not exported</text>

  <rect x="352" y="296" width="634" height="430" rx="22" fill="#0f172a"/>
  <text x="382" y="336" class="mono" font-size="13" fill="#94a3b8">diff --git a/packages/shared_contracts/src/scheduler.ts</text>
  <text x="382" y="370" class="mono" font-size="13" fill="#fca5a5">- export type SchedulerState = 'queued' | 'running';</text>
  <text x="382" y="404" class="mono" font-size="13" fill="#86efac">+ export type SchedulerState =</text>
  <text x="406" y="432" class="mono" font-size="13" fill="#86efac">+ | 'queued'</text>
  <text x="406" y="460" class="mono" font-size="13" fill="#86efac">+ | 'planning'</text>
  <text x="406" y="488" class="mono" font-size="13" fill="#86efac">+ | 'running'</text>
  <text x="406" y="516" class="mono" font-size="13" fill="#86efac">+ | 'blocked'</text>
  <text x="406" y="544" class="mono" font-size="13" fill="#86efac">+ | 'failed'</text>
  <text x="406" y="572" class="mono" font-size="13" fill="#86efac">+ | 'completed'</text>
  <text x="406" y="600" class="mono" font-size="13" fill="#86efac">+ | 'cancelled';</text>

  <rect x="352" y="768" width="130" height="40" rx="13" fill="#16a34a"/>
  <text x="386" y="793" class="ui" font-size="14" font-weight="760" fill="#ffffff">Accept</text>
  <rect x="496" y="768" width="160" height="40" rx="13" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="526" y="793" class="ui muted" font-size="14">Request changes</text>
  <rect x="670" y="768" width="112" height="40" rx="13" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="704" y="793" class="ui muted" font-size="14">Reject</text>
  <rect x="794" y="768" width="192" height="40" rx="13" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="824" y="793" class="ui muted" font-size="14">Reuse as context</text>

  <rect x="1030" y="118" width="340" height="788" fill="#fbfdff" stroke="#e2e8f0"/>
  <text x="1066" y="168" class="ui title" font-size="18">Provenance</text>
  <text x="1066" y="206" class="ui title" font-size="14">Source</text>
  <text x="1066" y="232" class="ui muted" font-size="13">run_01j · task_04 · agent_run_8f3</text>
  <line x1="1066" y1="266" x2="1334" y2="266" class="hair"/>
  <text x="1066" y="306" class="ui title" font-size="14">Input refs</text>
  <rect x="1066" y="324" width="268" height="50" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1088" y="354" class="ui muted" font-size="13">docs/design/domain-model.md</text>
  <rect x="1066" y="386" width="268" height="50" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1088" y="416" class="ui muted" font-size="13">ADR scheduler port</text>
  <text x="1066" y="486" class="ui title" font-size="14">Verification</text>
  <rect x="1066" y="504" width="268" height="74" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="1088" y="534" class="ui green" font-size="13" font-weight="760">✓ pnpm test packages/core</text>
  <text x="1088" y="558" class="ui muted" font-size="12">passed · 18s</text>
  <text x="1066" y="638" class="ui title" font-size="14">Review decision</text>
  <rect x="1066" y="656" width="268" height="94" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1088" y="688" class="ui muted" font-size="13">No decision recorded yet.</text>
  <text x="1088" y="714" class="ui soft" font-size="12">Accept / reject will create a trace event.</text>
  <text x="1066" y="808" class="ui title" font-size="14">Sensitivity</text>
  <text x="1066" y="834" class="ui muted" font-size="13">No secret detected · local path redacted on export</text>
</svg>