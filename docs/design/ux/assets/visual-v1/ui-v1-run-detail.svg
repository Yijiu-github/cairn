<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Cairn UI Visual Reference V1 - Run Detail</title>
  <desc id="desc">First visual reference for Cairn run detail control console.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-weight: 760; fill: #0f172a; }
      .muted { fill: #64748b; }
      .soft { fill: #94a3b8; }
      .panel { fill: rgba(255,255,255,0.88); stroke: #dbe3ef; }
      .card { fill: #ffffff; stroke: #dbe3ef; }
      .hair { stroke: #e2e8f0; stroke-width: 1; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .purple { fill: #7c3aed; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="54" y="54" width="1332" height="852" rx="32" class="panel" filter="url(#shadow)"/>
  <rect x="54" y="54" width="1332" height="64" rx="32" fill="#ffffff"/>
  <rect x="54" y="86" width="1332" height="32" fill="#ffffff"/>
  <text x="90" y="94" class="ui title" font-size="22">Cairn</text>
  <text x="164" y="94" class="ui muted" font-size="14">Run Detail</text>
  <rect x="1186" y="74" width="118" height="32" rx="11" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1212" y="95" class="ui red" font-size="13" font-weight="700">Cancel run</text>

  <rect x="54" y="118" width="84" height="788" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="78" y="170" class="ui blue" font-size="13" font-weight="700">Runs</text>
  <text x="78" y="222" class="ui soft" font-size="13">Tasks</text>
  <text x="78" y="274" class="ui soft" font-size="13">Files</text>

  <rect x="138" y="118" width="304" height="788" fill="#fbfdff" stroke="#e2e8f0"/>
  <text x="174" y="168" class="ui title" font-size="18">Task tree</text>
  <text x="174" y="198" class="ui muted" font-size="13">attempt 2 · retryable</text>
  <rect x="166" y="232" width="244" height="52" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="190" y="263" class="ui title" font-size="14">✓ Read architecture docs</text>
  <rect x="166" y="300" width="244" height="52" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="190" y="331" class="ui title" font-size="14">✓ Inspect current contracts</text>
  <rect x="166" y="368" width="244" height="70" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="190" y="397" class="ui blue" font-size="14" font-weight="760">● Implement scheduler port</text>
  <text x="190" y="420" class="ui muted" font-size="12">running · agent_run_8f3</text>
  <rect x="166" y="454" width="244" height="52" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="190" y="485" class="ui amber" font-size="14" font-weight="700">▲ Await protected write</text>
  <rect x="166" y="522" width="244" height="52" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="190" y="553" class="ui muted" font-size="14">◌ Run acceptance checks</text>

  <rect x="442" y="118" width="614" height="788" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="482" y="168" class="ui title" font-size="28">Add scheduler port ADR follow-up</text>
  <text x="482" y="200" class="ui muted" font-size="14">Goal: keep orchestration boundary portable without leaking desktop-only assumptions.</text>
  <rect x="482" y="226" width="110" height="30" rx="10" fill="#eff6ff"/>
  <text x="506" y="246" class="ui blue" font-size="12" font-weight="700">Running</text>
  <rect x="604" y="226" width="138" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="624" y="246" class="ui muted" font-size="12">4 tasks · 2 artifacts</text>
  <rect x="754" y="226" width="120" height="30" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="774" y="246" class="ui muted" font-size="12">Cost $0.18</text>

  <text x="482" y="306" class="ui title" font-size="17">Active work surface</text>
  <rect x="482" y="328" width="534" height="220" rx="20" fill="#0f172a"/>
  <text x="510" y="366" class="mono" font-size="13" fill="#bfdbfe">agent_run_8f3</text>
  <text x="510" y="398" class="mono" font-size="13" fill="#e2e8f0">$ pnpm test packages/core</text>
  <text x="510" y="430" class="mono" font-size="13" fill="#86efac">✓ contracts scheduler port validates queued/running states</text>
  <text x="510" y="462" class="mono" font-size="13" fill="#fde68a">! protected write requested: packages/shared_contracts/...</text>
  <text x="510" y="494" class="mono" font-size="13" fill="#94a3b8">waiting for operator approval…</text>

  <text x="482" y="596" class="ui title" font-size="17">Evidence</text>
  <rect x="482" y="620" width="162" height="82" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="506" y="652" class="ui title" font-size="14">patch.diff</text>
  <text x="506" y="676" class="ui muted" font-size="12">review pending</text>
  <rect x="662" y="620" width="162" height="82" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="686" y="652" class="ui title" font-size="14">test.log</text>
  <text x="686" y="676" class="ui green" font-size="12">3 checks passed</text>
  <rect x="842" y="620" width="174" height="82" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="866" y="652" class="ui title" font-size="14">summary.md</text>
  <text x="866" y="676" class="ui muted" font-size="12">generated</text>

  <text x="482" y="760" class="ui title" font-size="17">Intervention</text>
  <rect x="482" y="784" width="534" height="74" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="510" y="814" class="ui amber" font-size="13" font-weight="700">Effect: applies now</text>
  <text x="510" y="840" class="ui muted" font-size="13">Approve this single protected write, then resume the current agent run.</text>
  <rect x="856" y="804" width="126" height="34" rx="11" fill="#0f172a"/>
  <text x="878" y="826" class="ui" font-size="13" fill="#ffffff">Approve once</text>

  <rect x="1056" y="118" width="330" height="788" fill="#fbfdff" stroke="#e2e8f0"/>
  <text x="1090" y="168" class="ui title" font-size="18">Inspector</text>
  <rect x="1090" y="196" width="250" height="36" rx="12" fill="#f1f5f9"/>
  <text x="1112" y="219" class="ui title" font-size="13">Trace</text>
  <text x="1166" y="219" class="ui muted" font-size="13">Causality</text>
  <text x="1258" y="219" class="ui muted" font-size="13">Cost</text>
  <line x1="1090" y1="270" x2="1340" y2="270" class="hair"/>
  <text x="1090" y="306" class="ui title" font-size="14">First failure</text>
  <text x="1090" y="332" class="ui muted" font-size="13">protected_write_request</text>
  <text x="1090" y="372" class="ui title" font-size="14">Upstream</text>
  <text x="1090" y="398" class="ui muted" font-size="13">Task: Implement scheduler port</text>
  <text x="1090" y="422" class="ui muted" font-size="13">Tool: edit file</text>
  <text x="1090" y="462" class="ui title" font-size="14">Decision record</text>
  <rect x="1090" y="484" width="250" height="92" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1114" y="516" class="ui muted" font-size="13">No human decision yet.</text>
  <text x="1114" y="542" class="ui soft" font-size="12">Approval will be stored as</text>
  <text x="1114" y="564" class="mono soft" font-size="12">operator_action_id</text>
  <text x="1090" y="636" class="ui title" font-size="14">Metadata</text>
  <text x="1090" y="666" class="mono muted" font-size="12">run_id: run_01j...</text>
  <text x="1090" y="690" class="mono muted" font-size="12">workspace_id: ws_01j...</text>
  <text x="1090" y="714" class="mono muted" font-size="12">attempt: 2</text>
</svg>