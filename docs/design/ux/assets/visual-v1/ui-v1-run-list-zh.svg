<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Cairn UI Visual Reference V1 - 运行列表</title>
  <desc id="desc">Cairn 运行列表 中文主界面视觉参考。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-weight: 760; fill: #0f172a; }
      .muted { fill: #64748b; }
      .soft { fill: #94a3b8; }
      .panel { fill: rgba(255,255,255,0.88); stroke: #dbe3ef; }
      .card { fill: #ffffff; stroke: #dbe3ef; }
      .hair { stroke: #e2e8f0; stroke-width: 1; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .purple { fill: #7c3aed; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="60" y="54" width="1320" height="852" rx="32" class="panel" filter="url(#shadow)"/>
  <rect x="60" y="54" width="1320" height="64" rx="32" fill="#ffffff"/>
  <rect x="60" y="86" width="1320" height="32" fill="#ffffff"/>
  <text x="96" y="94" class="ui title" font-size="22">Cairn</text>
  <text x="174" y="94" class="ui muted" font-size="14">运行列表</text>
  <rect x="60" y="118" width="236" height="788" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="108" y="177" class="ui muted" font-size="15">首页 / 待处理</text><rect x="84" y="200" width="188" height="40" rx="12" fill="#eff6ff"/><text x="108" y="225" class="ui blue" font-size="15" font-weight="700">运行</text><text x="108" y="273" class="ui muted" font-size="15">运行时状态</text><text x="108" y="321" class="ui muted" font-size="15">设置</text>

  <text x="344" y="168" class="ui title" font-size="34">运行列表</text>
  <text x="346" y="204" class="ui muted" font-size="15">按状态、时间、运行时和是否需要接管来筛选所有 Run。</text>
  <rect x="344" y="246" width="936" height="74" rx="22" class="card"/>
  <rect x="374" y="268" width="230" height="34" rx="12" fill="#f8fafc" stroke="#dbe3ef"/><text x="398" y="290" class="ui soft" font-size="13">搜索运行、任务、产物…</text>
  <rect x="626" y="268" width="88" height="34" rx="11" fill="#eff6ff"/><text x="652" y="290" class="ui blue" font-size="13" font-weight="700">全部</text>
  <text x="742" y="290" class="ui muted" font-size="13">已阻塞</text><text x="820" y="290" class="ui muted" font-size="13">失败</text><text x="884" y="290" class="ui muted" font-size="13">运行中</text><text x="964" y="290" class="ui muted" font-size="13">已完成</text>
  <rect x="1130" y="266" width="118" height="38" rx="13" fill="url(#brand)"/><text x="1162" y="290" class="ui" font-size="13" fill="#fff" font-weight="760">新建运行</text>

  <rect x="344" y="352" width="936" height="82" rx="18" class="card"/>
  <text x="374" y="384" class="ui title" font-size="15">审阅 scheduler port 修改</text>
  <text x="374" y="410" class="ui muted" font-size="13">等待仅本次批准</text>
  <rect x="704" y="374" width="92" height="30" rx="10" fill="#fff7ed"/><text x="726" y="394" class="ui" font-size="12" font-weight="760" fill="#d97706">已阻塞</text>
  <text x="840" y="394" class="ui muted" font-size="13">任务 4 / 6</text>
  <text x="996" y="394" class="ui muted" font-size="13">产物 2</text>
  <text x="1150" y="394" class="ui soft" font-size="13">8 分钟</text>
  <rect x="344" y="452" width="936" height="82" rx="18" class="card"/>
  <text x="374" y="484" class="ui title" font-size="15">补充 UX tokens</text>
  <text x="374" y="510" class="ui muted" font-size="13">正在生成组件规格</text>
  <rect x="704" y="474" width="92" height="30" rx="10" fill="#eff6ff"/><text x="726" y="494" class="ui" font-size="12" font-weight="760" fill="#2563eb">运行中</text>
  <text x="840" y="494" class="ui muted" font-size="13">任务 3 / 5</text>
  <text x="996" y="494" class="ui muted" font-size="13">产物 5</text>
  <text x="1150" y="494" class="ui soft" font-size="13">12 分钟</text>
  <rect x="344" y="552" width="936" height="82" rx="18" class="card"/>
  <text x="374" y="584" class="ui title" font-size="15">整理安装文档</text>
  <text x="374" y="610" class="ui muted" font-size="13">产物已接受</text>
  <rect x="704" y="574" width="92" height="30" rx="10" fill="#f0fdf4"/><text x="726" y="594" class="ui" font-size="12" font-weight="760" fill="#16a34a">已完成</text>
  <text x="840" y="594" class="ui muted" font-size="13">任务 7 / 7</text>
  <text x="996" y="594" class="ui muted" font-size="13">产物 3</text>
  <text x="1150" y="594" class="ui soft" font-size="13">昨天</text>
  <rect x="344" y="652" width="936" height="82" rx="18" class="card"/>
  <text x="374" y="684" class="ui title" font-size="15">验证 runtime auth</text>
  <text x="374" y="710" class="ui muted" font-size="13">Codex CLI 认证过期</text>
  <rect x="704" y="674" width="92" height="30" rx="10" fill="#fef2f2"/><text x="726" y="694" class="ui" font-size="12" font-weight="760" fill="#dc2626">失败</text>
  <text x="840" y="694" class="ui muted" font-size="13">任务 2 / 4</text>
  <text x="996" y="694" class="ui muted" font-size="13">产物 1</text>
  <text x="1150" y="694" class="ui soft" font-size="13">2 天前</text>
  <rect x="344" y="782" width="936" height="78" rx="20" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="374" y="814" class="ui title" font-size="14">交互说明</text>
  <text x="374" y="840" class="ui muted" font-size="13">hover 行显示轻阴影；点击行进入详情；状态筛选支持键盘左右切换；失败/阻塞默认排在顶部。</text>
</svg>
