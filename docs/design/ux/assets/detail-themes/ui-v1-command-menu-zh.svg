<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Cairn Detail Theme - 命令菜单细节</title><desc id="desc">⌘K / Ctrl+K 的全局搜索与命令入口。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="55%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#f7f3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-weight:760;fill:#0f172a}.muted{fill:#64748b}.soft{fill:#94a3b8}.panel{fill:rgba(255,255,255,.88);stroke:#dbe3ef}.card{fill:#fff;stroke:#dbe3ef}.hair{stroke:#e2e8f0;stroke-width:1}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#d97706}.red{fill:#dc2626}.purple{fill:#7c3aed}</style>
  </defs>
<rect width="1440" height="960" fill="url(#bg)"/><rect x="70" y="54" width="1300" height="852" rx="32" class="panel" filter="url(#shadow)"/><text x="112" y="120" class="ui title" font-size="32">命令菜单细节</text><text x="114" y="154" class="ui muted" font-size="15">⌘K / Ctrl+K 的全局搜索与命令入口。</text>
<rect x="270" y="210" width="900" height="548" rx="30" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>
<rect x="310" y="250" width="820" height="56" rx="18" fill="#f8fafc" stroke="#dbe3ef"/><text x="340" y="285" class="ui soft" font-size="16">搜索运行、产物、命令或输入动作…</text><text x="1070" y="285" class="mono soft" font-size="13">⌘K</text>
<text x="310" y="352" class="ui title" font-size="14">推荐命令</text>
<rect x="310" y="376" width="820" height="62" rx="18" fill="#eff6ff" stroke="#bfdbfe"/><text x="342" y="411" class="ui blue" font-size="15" font-weight="760">新建运行</text><text x="986" y="411" class="mono muted" font-size="12">Enter</text>
<rect x="310" y="452" width="820" height="62" rx="18" class="card"/><text x="342" y="487" class="ui title" font-size="15">打开待处理队列</text><text x="920" y="487" class="mono muted" font-size="12">G then I</text>
<rect x="310" y="528" width="820" height="62" rx="18" class="card"/><text x="342" y="563" class="ui title" font-size="15">复制脱敏状态</text><text x="942" y="563" class="mono muted" font-size="12">Diagnostics</text>
<text x="310" y="642" class="ui title" font-size="14">交互细节</text><text x="310" y="674" class="ui muted" font-size="13">↑/↓ 选择；Enter 执行；Esc 关闭；危险命令不会直接执行，会先打开确认弹窗。</text></svg>