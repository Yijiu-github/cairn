<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Cairn Detail Theme - 诊断导出细节</title><desc id="desc">导出前展示包含内容，默认脱敏并提示本地路径风险。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="55%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#f7f3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-weight:760;fill:#0f172a}.muted{fill:#64748b}.soft{fill:#94a3b8}.panel{fill:rgba(255,255,255,.88);stroke:#dbe3ef}.card{fill:#fff;stroke:#dbe3ef}.hair{stroke:#e2e8f0;stroke-width:1}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#d97706}.red{fill:#dc2626}.purple{fill:#7c3aed}</style>
  </defs>
<rect width="1440" height="960" fill="url(#bg)"/><rect x="70" y="54" width="1300" height="852" rx="32" class="panel" filter="url(#shadow)"/><text x="112" y="120" class="ui title" font-size="32">诊断导出细节</text><text x="114" y="154" class="ui muted" font-size="15">导出前展示包含内容，默认脱敏并提示本地路径风险。</text>
<rect x="210" y="210" width="1020" height="570" rx="30" class="card" filter="url(#shadow)"/>
<text x="256" y="270" class="ui title" font-size="24">导出诊断包</text><text x="256" y="304" class="ui muted" font-size="14">默认脱敏 token，但本地路径和文件名仍可能包含个人信息。</text>
<rect x="256" y="352" width="444" height="300" rx="22" fill="#f8fafc" stroke="#dbe3ef"/><text x="288" y="396" class="ui title" font-size="16">包含内容</text><text x="288" y="436" class="ui green" font-size="14">✓ Core health snapshot</text><text x="288" y="472" class="ui green" font-size="14">✓ Runtime check result</text><text x="288" y="508" class="ui green" font-size="14">✓ Recent redacted logs</text><text x="288" y="544" class="ui amber" font-size="14">! Local paths, filenames</text><text x="288" y="580" class="ui red" font-size="14">× Raw token values excluded</text>
<rect x="738" y="352" width="444" height="300" rx="22" fill="#0f172a"/><text x="770" y="396" class="mono" font-size="13" fill="#bfdbfe">redacted-status.json</text><text x="770" y="436" class="mono" font-size="12" fill="#cbd5e1">workspace_path: ~/Cairn/... </text><text x="770" y="466" class="mono" font-size="12" fill="#cbd5e1">codex_auth: ready</text><text x="770" y="496" class="mono" font-size="12" fill="#cbd5e1">token: [REDACTED]</text><text x="770" y="526" class="mono" font-size="12" fill="#cbd5e1">recent_error: protected_write_request</text>
<rect x="256" y="694" width="160" height="44" rx="14" fill="#ffffff" stroke="#dbe3ef"/><text x="310" y="722" class="ui muted" font-size="14">取消</text><rect x="938" y="694" width="244" height="44" rx="14" fill="url(#brand)"/><text x="992" y="722" class="ui" fill="#fff" font-size="14" font-weight="760">导出脱敏诊断包</text></svg>