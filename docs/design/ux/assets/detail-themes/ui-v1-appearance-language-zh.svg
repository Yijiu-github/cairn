<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Cairn Detail Theme - 外观与语言主题</title><desc id="desc">中文主界面、英文切换、浅色默认与深色预留。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="55%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#f7f3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-weight:760;fill:#0f172a}.muted{fill:#64748b}.soft{fill:#94a3b8}.panel{fill:rgba(255,255,255,.88);stroke:#dbe3ef}.card{fill:#fff;stroke:#dbe3ef}.hair{stroke:#e2e8f0;stroke-width:1}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#d97706}.red{fill:#dc2626}.purple{fill:#7c3aed}</style>
  </defs>
<rect width="1440" height="960" fill="url(#bg)"/><rect x="70" y="54" width="1300" height="852" rx="32" class="panel" filter="url(#shadow)"/><text x="112" y="120" class="ui title" font-size="32">外观与语言主题</text><text x="114" y="154" class="ui muted" font-size="15">中文主界面、英文切换、浅色默认与深色预留。</text>
<rect x="190" y="210" width="500" height="570" rx="30" class="card" filter="url(#shadow)"/><text x="232" y="270" class="ui title" font-size="22">外观与语言</text><text x="232" y="304" class="ui muted" font-size="14">中文为主，英文可切换；主题先支持浅色，预留深色。</text>
<text x="232" y="366" class="ui title" font-size="15">界面语言</text><rect x="232" y="390" width="128" height="40" rx="13" fill="#eff6ff"/><text x="258" y="416" class="ui blue" font-size="14" font-weight="760">简体中文</text><rect x="374" y="390" width="104" height="40" rx="13" fill="#f8fafc" stroke="#dbe3ef"/><text x="402" y="416" class="ui muted" font-size="14">English</text>
<text x="232" y="488" class="ui title" font-size="15">主题</text><rect x="232" y="514" width="128" height="40" rx="13" fill="#eff6ff"/><text x="276" y="540" class="ui blue" font-size="14" font-weight="760">浅色</text><rect x="374" y="514" width="104" height="40" rx="13" fill="#0f172a"/><text x="410" y="540" class="ui" fill="#fff" font-size="14">深色</text><text x="494" y="540" class="ui soft" font-size="12">未来</text>
<text x="232" y="628" class="ui title" font-size="15">动效</text><text x="232" y="658" class="ui muted" font-size="13">Hover 抬升和阴影可跟随 reduce motion 降低。</text>
<rect x="750" y="210" width="500" height="570" rx="30" fill="#0f172a"/><text x="792" y="270" class="ui" font-size="22" fill="#fff" font-weight="760">深色主题预览</text><rect x="792" y="326" width="370" height="92" rx="20" fill="#172033" stroke="#334155"/><text x="822" y="362" class="ui" font-size="15" fill="#fff">待我处理</text><text x="822" y="390" class="ui" font-size="13" fill="#94a3b8">批准文件写入 · 8 分钟</text><rect x="792" y="454" width="370" height="92" rx="20" fill="#172033" stroke="#334155"/><text x="822" y="490" class="ui" font-size="15" fill="#fff">运行状态</text><text x="822" y="518" class="ui" font-size="13" fill="#86efac">Core 正常 · Codex 就绪</text></svg>