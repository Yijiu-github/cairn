<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Cairn Detail Theme - 空错态细节</title><desc id="desc">空状态、错误状态和恢复动作的细节示例。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="55%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#f7f3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-weight:760;fill:#0f172a}.muted{fill:#64748b}.soft{fill:#94a3b8}.panel{fill:rgba(255,255,255,.88);stroke:#dbe3ef}.card{fill:#fff;stroke:#dbe3ef}.hair{stroke:#e2e8f0;stroke-width:1}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#d97706}.red{fill:#dc2626}.purple{fill:#7c3aed}</style>
  </defs>
<rect width="1440" height="960" fill="url(#bg)"/><rect x="70" y="54" width="1300" height="852" rx="32" class="panel" filter="url(#shadow)"/><text x="112" y="120" class="ui title" font-size="32">空错态细节</text><text x="114" y="154" class="ui muted" font-size="15">空状态、错误状态和恢复动作的细节示例。</text>
<rect x="170" y="210" width="520" height="250" rx="28" class="card" filter="url(#shadow)"/><text x="214" y="270" class="ui title" font-size="22">还没有运行</text><text x="214" y="306" class="ui muted" font-size="14">给 Cairn 一个目标、上下文和验收标准，产物和证据会沉淀在这里。</text><rect x="214" y="360" width="126" height="42" rx="14" fill="url(#brand)"/><text x="246" y="386" class="ui" fill="#fff" font-size="14" font-weight="760">新建运行</text>
<rect x="750" y="210" width="520" height="250" rx="28" class="card"/><text x="794" y="270" class="ui red" font-size="22" font-weight="760">产物文件不存在</text><text x="794" y="306" class="ui muted" font-size="14">Cairn 仍保留了来源链，但本地文件可能已被移动或删除。</text><rect x="794" y="360" width="126" height="42" rx="14" fill="#ffffff" stroke="#dbe3ef"/><text x="824" y="386" class="ui muted" font-size="14">定位文件</text><text x="940" y="386" class="ui blue" font-size="14">查看来源链</text>
<rect x="170" y="520" width="1100" height="210" rx="28" fill="#f8fafc" stroke="#dbe3ef"/><text x="214" y="574" class="ui title" font-size="18">文案原则</text><text x="214" y="614" class="ui muted" font-size="14">空状态说明下一步，错误状态说明层级和恢复动作。不要只写“暂无数据”或“发生错误”。</text><text x="214" y="654" class="ui muted" font-size="14">所有错误都应能追溯到 orchestration / task / execution / artifact / runtime 之一。</text></svg>