<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Cairn Detail Theme - 受保护动作确认</title><desc id="desc">危险动作需要明确影响范围、仅本次批准和 trace 记录。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="55%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#f7f3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-weight:760;fill:#0f172a}.muted{fill:#64748b}.soft{fill:#94a3b8}.panel{fill:rgba(255,255,255,.88);stroke:#dbe3ef}.card{fill:#fff;stroke:#dbe3ef}.hair{stroke:#e2e8f0;stroke-width:1}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#d97706}.red{fill:#dc2626}.purple{fill:#7c3aed}</style>
  </defs>
<rect width="1440" height="960" fill="url(#bg)"/><rect x="70" y="54" width="1300" height="852" rx="32" class="panel" filter="url(#shadow)"/><text x="112" y="120" class="ui title" font-size="32">受保护动作确认</text><text x="114" y="154" class="ui muted" font-size="15">危险动作需要明确影响范围、仅本次批准和 trace 记录。</text>
<rect x="250" y="210" width="940" height="560" rx="30" class="card" filter="url(#shadow)"/>
<rect x="250" y="210" width="940" height="86" rx="30" fill="#fff7ed"/><text x="292" y="262" class="ui amber" font-size="22" font-weight="760">批准受保护动作？</text>
<text x="292" y="344" class="ui title" font-size="16">Agent 请求写入受保护路径</text><text x="292" y="374" class="ui muted" font-size="14">这次批准只对当前 tool call 生效，不会创建永久授权。</text>
<rect x="292" y="412" width="856" height="110" rx="20" fill="#0f172a"/><text x="324" y="452" class="mono" font-size="13" fill="#fde68a">target: packages/shared_contracts/src/scheduler.ts</text><text x="324" y="484" class="mono" font-size="13" fill="#cbd5e1">action: file.write · run_id: run_01j... · attempt: 2</text>
<text x="292" y="572" class="ui title" font-size="14">批准后会发生什么</text><text x="292" y="602" class="ui muted" font-size="13">当前 AgentRun 会继续执行；系统会写入 operatorActionId，并把决策记录到 trace。</text>
