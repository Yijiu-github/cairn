<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200" role="img" aria-labelledby="title desc">
<title id="title">Cairn Common Components V1</title><desc id="desc">Cairn 常用组件统一设计总览。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="60%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#f7f3ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-weight:760;fill:#0f172a}.muted{fill:#64748b}.soft{fill:#94a3b8}.panel{fill:rgba(255,255,255,.9);stroke:#dbe3ef}.card{fill:#fff;stroke:#dbe3ef}.hair{stroke:#e2e8f0;stroke-width:1}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#d97706}.red{fill:#dc2626}.purple{fill:#7c3aed}</style>
  </defs>
<rect width="1440" height="1200" fill="url(#bg)"/>
<rect x="60" y="54" width="1320" height="1090" rx="34" class="panel" filter="url(#shadow)"/>
<text x="104" y="118" class="ui title" font-size="34">常用组件 V1</text><text x="106" y="154" class="ui muted" font-size="15">统一 Button、Input、Badge、Card、Dialog、Toast、Tabs、Tooltip、Table、Progress 等基础组件。</text>

<text x="104" y="230" class="ui title" font-size="20">Buttons</text>
<rect x="104" y="260" width="132" height="44" rx="14" fill="url(#brand)"/><text x="144" y="288" class="ui" fill="#fff" font-size="14" font-weight="760">主按钮</text>
<rect x="252" y="260" width="132" height="44" rx="14" fill="#fff" stroke="#dbe3ef"/><text x="292" y="288" class="ui muted" font-size="14">次按钮</text>
<rect x="400" y="260" width="132" height="44" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="434" y="288" class="ui red" font-size="14" font-weight="760">危险按钮</text>
<rect x="548" y="260" width="132" height="44" rx="14" fill="#f1f5f9"/><text x="588" y="288" class="ui soft" font-size="14">禁用态</text>
<rect x="696" y="260" width="152" height="44" rx="14" fill="#0f172a"/><text x="734" y="288" class="ui" fill="#fff" font-size="14">处理中…</text>

<text x="104" y="372" class="ui title" font-size="20">Inputs</text>
<rect x="104" y="402" width="310" height="48" rx="15" fill="#f8fafc" stroke="#dbe3ef"/><text x="130" y="432" class="ui soft" font-size="14">输入运行目标…</text>
<rect x="436" y="402" width="310" height="48" rx="15" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="462" y="432" class="ui title" font-size="14">聚焦输入框</text>
<rect x="768" y="402" width="310" height="48" rx="15" fill="#fff7ed" stroke="#fed7aa"/><text x="794" y="432" class="ui amber" font-size="14">需要选择工作目录</text>

<text x="104" y="520" class="ui title" font-size="20">Status Badges</text>
<rect x="104" y="550" width="92" height="32" rx="11" fill="#eff6ff"/><text x="128" y="571" class="ui blue" font-size="13" font-weight="760">运行中</text>
<rect x="212" y="550" width="92" height="32" rx="11" fill="#fff7ed"/><text x="236" y="571" class="ui amber" font-size="13" font-weight="760">已阻塞</text>
<rect x="320" y="550" width="92" height="32" rx="11" fill="#f0fdf4"/><text x="344" y="571" class="ui green" font-size="13" font-weight="760">已完成</text>
<rect x="428" y="550" width="92" height="32" rx="11" fill="#fef2f2"/><text x="458" y="571" class="ui red" font-size="13" font-weight="760">失败</text>
<rect x="536" y="550" width="106" height="32" rx="11" fill="#f8fafc" stroke="#dbe3ef"/><text x="560" y="571" class="ui muted" font-size="13">待审阅</text>

<text x="104" y="660" class="ui title" font-size="20">Cards</text>
<rect x="104" y="690" width="250" height="126" rx="22" class="card"/><text x="134" y="730" class="ui title" font-size="16">普通卡片</text><text x="134" y="758" class="ui muted" font-size="13">默认无阴影，hover 时轻微抬升。</text>
<rect x="384" y="690" width="250" height="126" rx="22" fill="#fff7ed" stroke="#fed7aa"/><text x="414" y="730" class="ui amber" font-size="16" font-weight="760">待我处理</text><text x="414" y="758" class="ui muted" font-size="13">必须显示来源、原因和主动作。</text>
<rect x="664" y="690" width="250" height="126" rx="22" fill="#f8fafc" stroke="#dbe3ef"/><text x="694" y="730" class="ui title" font-size="16">产物卡片</text><text x="694" y="758" class="ui muted" font-size="13">显示 review state 和 verification。</text>

<text x="104" y="894" class="ui title" font-size="20">Dialog / Toast / Tooltip</text>
<rect x="104" y="924" width="366" height="150" rx="24" class="card" filter="url(#shadow)"/><text x="134" y="966" class="ui title" font-size="17">取消这个运行？</text><text x="134" y="996" class="ui muted" font-size="13">危险确认必须写清影响范围。</text><rect x="134" y="1026" width="92" height="36" rx="12" fill="#fff" stroke="#dbe3ef"/><text x="164" y="1049" class="ui muted" font-size="13">返回</text><rect x="242" y="1026" width="112" height="36" rx="12" fill="#dc2626"/><text x="270" y="1049" class="ui" fill="#fff" font-size="13">取消运行</text>
<rect x="512" y="924" width="350" height="74" rx="18" fill="#0f172a"/><text x="542" y="956" class="ui" fill="#fff" font-size="14" font-weight="760">已复制脱敏状态</text><text x="542" y="978" class="ui" fill="#cbd5e1" font-size="12">可以粘贴给维护者排查。</text>
<rect x="902" y="924" width="274" height="58" rx="16" fill="#fff" stroke="#dbe3ef" filter="url(#shadow)"/><text x="930" y="958" class="ui muted" font-size="13">本地路径可能包含个人信息</text>

<text x="960" y="230" class="ui title" font-size="20">Table / Progress</text>
<rect x="960" y="260" width="320" height="204" rx="22" class="card"/><text x="990" y="300" class="ui title" font-size="14">运行</text><text x="1160" y="300" class="ui title" font-size="14">状态</text><line x1="990" y1="324" x2="1250" y2="324" class="hair"/><text x="990" y="360" class="ui muted" font-size="13">scheduler ADR</text><text x="1160" y="360" class="ui amber" font-size="13">阻塞</text><text x="990" y="402" class="ui muted" font-size="13">UX tokens</text><text x="1160" y="402" class="ui blue" font-size="13">运行中</text><rect x="990" y="430" width="236" height="8" rx="4" fill="#e2e8f0"/><rect x="990" y="430" width="150" height="8" rx="4" fill="#2563eb"/>

<text x="960" y="540" class="ui title" font-size="20">Tabs / Segmented</text>
<rect x="960" y="570" width="320" height="46" rx="15" fill="#f1f5f9"/><rect x="966" y="576" width="92" height="34" rx="12" fill="#fff"/><text x="990" y="598" class="ui blue" font-size="13" font-weight="760">Trace</text><text x="1082" y="598" class="ui muted" font-size="13">因果链</text><text x="1170" y="598" class="ui muted" font-size="13">成本</text>

<text x="960" y="692" class="ui title" font-size="20">Skeleton</text>
<rect x="960" y="722" width="320" height="92" rx="20" fill="#fff" stroke="#dbe3ef"/><rect x="990" y="750" width="180" height="14" rx="7" fill="#e2e8f0"/><rect x="990" y="780" width="240" height="12" rx="6" fill="#eef2f7"/>
</svg>