<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Cairn UI Visual Reference V1 - First Launch</title>
  <desc id="desc">First visual reference for Cairn first launch wizard.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-weight: 760; fill: #0f172a; }
      .muted { fill: #64748b; }
      .soft { fill: #94a3b8; }
      .panel { fill: rgba(255,255,255,0.88); stroke: #dbe3ef; }
      .card { fill: #ffffff; stroke: #dbe3ef; }
      .hair { stroke: #e2e8f0; stroke-width: 1; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .purple { fill: #7c3aed; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="120" y="78" width="1200" height="804" rx="34" class="panel" filter="url(#shadow)"/>
  <rect x="120" y="78" width="382" height="804" rx="34" fill="#0f172a"/>
  <rect x="468" y="78" width="34" height="804" fill="#0f172a"/>
  <text x="172" y="166" class="ui" font-size="28" font-weight="780" fill="#ffffff">Cairn</text>
  <text x="172" y="204" class="ui" font-size="15" fill="#cbd5e1">Local-first multi-agent workspace</text>
  <text x="172" y="286" class="ui" font-size="13" font-weight="760" fill="#93c5fd">SETUP MAP</text>
  <circle cx="186" cy="334" r="10" fill="#60a5fa"/><text x="214" y="340" class="ui" font-size="15" fill="#ffffff">Workspace folder</text>
  <line x1="186" y1="350" x2="186" y2="398" stroke="#334155" stroke-width="2"/>
  <circle cx="186" cy="414" r="10" fill="#334155" stroke="#64748b"/><text x="214" y="420" class="ui" font-size="15" fill="#cbd5e1">Local core</text>
  <line x1="186" y1="430" x2="186" y2="478" stroke="#334155" stroke-width="2"/>
  <circle cx="186" cy="494" r="10" fill="#334155" stroke="#64748b"/><text x="214" y="500" class="ui" font-size="15" fill="#cbd5e1">Agent runtime</text>
  <line x1="186" y1="510" x2="186" y2="558" stroke="#334155" stroke-width="2"/>
  <circle cx="186" cy="574" r="10" fill="#334155" stroke="#64748b"/><text x="214" y="580" class="ui" font-size="15" fill="#cbd5e1">First run</text>
  <rect x="172" y="710" width="246" height="88" rx="20" fill="#172033" stroke="#334155"/>
  <text x="196" y="744" class="ui" font-size="14" font-weight="760" fill="#ffffff">Privacy note</text>
  <text x="196" y="772" class="ui" font-size="12" fill="#cbd5e1">Data, artifacts, and logs stay in your selected local workspace.</text>

  <text x="570" y="166" class="ui title" font-size="34">Choose where Cairn lives</text>
  <text x="572" y="204" class="ui muted" font-size="15">This folder stores SQLite data, artifacts, logs, and local configuration.</text>
  <rect x="570" y="260" width="666" height="142" rx="24" class="card"/>
  <text x="604" y="306" class="ui title" font-size="16">Workspace data directory</text>
  <rect x="604" y="330" width="454" height="44" rx="14" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="628" y="358" class="mono muted" font-size="13">/Users/you/Cairn Workspace</text>
  <rect x="1076" y="330" width="126" height="44" rx="14" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="1110" y="358" class="ui muted" font-size="14">Choose…</text>

  <text x="570" y="468" class="ui title" font-size="20">Preflight checks</text>
  <rect x="570" y="494" width="666" height="212" rx="24" class="card"/>
  <circle cx="612" cy="544" r="12" fill="#dcfce7"/><text x="606" y="549" class="ui green" font-size="14">✓</text><text x="642" y="549" class="ui title" font-size="15">Folder writable</text><text x="1096" y="549" class="ui green" font-size="13">Ready</text>
  <line x1="604" y1="574" x2="1202" y2="574" class="hair"/>
  <circle cx="612" cy="616" r="12" fill="#eff6ff"/><text x="606" y="621" class="ui blue" font-size="14">●</text><text x="642" y="621" class="ui title" font-size="15">Workspace Core</text><text x="1078" y="621" class="ui blue" font-size="13">Will start locally</text>
  <line x1="604" y1="646" x2="1202" y2="646" class="hair"/>
  <circle cx="612" cy="688" r="12" fill="#fef3c7"/><text x="606" y="693" class="ui amber" font-size="14">!</text><text x="642" y="693" class="ui title" font-size="15">Codex CLI runtime</text><text x="1086" y="693" class="ui amber" font-size="13">Needs check</text>

  <rect x="570" y="760" width="148" height="44" rx="14" fill="#ffffff" stroke="#dbe3ef"/>
  <text x="612" y="788" class="ui muted" font-size="14">Back</text>
  <rect x="1036" y="760" width="200" height="44" rx="14" fill="url(#brand)"/>
  <text x="1082" y="788" class="ui" font-size="14" font-weight="760" fill="#ffffff">Continue setup</text>
</svg>