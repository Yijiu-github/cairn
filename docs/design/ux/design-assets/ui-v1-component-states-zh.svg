<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Cairn Component States V1</title><desc id="desc">组件状态与空错态视觉板。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef4ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>.ui{font-family:Inter,ui-sans-serif,system-ui}.mono{font-family:SFMono-Regular,Menlo,monospace}.title{font-weight:760;fill:#0f172a}.muted{fill:#64748b}.card{fill:#fff;stroke:#dbe3ef}.blue{fill:#2563eb}.green{fill:#16a34a}.amber{fill:#d97706}.red{fill:#dc2626}</style>
  </defs>
<rect width="1440" height="960" fill="url(#bg)"/>
<text x="92" y="102" class="ui title" font-size="34">组件状态板 V1</text><text x="94" y="138" class="ui muted" font-size="15">hover、focus、loading、empty、error 和 danger confirmation 的实现参考。</text>
<rect x="92" y="190" width="390" height="220" rx="24" class="card" filter="url(#shadow)"/><text x="126" y="238" class="ui title" font-size="18">RunCard 状态</text><rect x="126" y="268" width="310" height="54" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="150" y="300" class="ui amber" font-size="14" font-weight="760">已阻塞 · 等待接管</text><rect x="126" y="338" width="310" height="54" rx="16" fill="#eff6ff" stroke="#bfdbfe"/><text x="150" y="370" class="ui blue" font-size="14" font-weight="760">hover：轻阴影 + 1px 上浮</text>
<rect x="526" y="190" width="390" height="220" rx="24" class="card"/><text x="560" y="238" class="ui title" font-size="18">Focus-visible</text><rect x="560" y="278" width="210" height="48" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="554" y="272" width="222" height="60" rx="18" fill="none" stroke="rgba(37,99,235,0.20)" stroke-width="6"/><text x="600" y="308" class="ui blue" font-size="14" font-weight="760">仅本次批准</text><text x="560" y="366" class="ui muted" font-size="13">键盘焦点必须有 ring，不能只靠阴影。</text>
<rect x="960" y="190" width="390" height="220" rx="24" class="card"/><text x="994" y="238" class="ui title" font-size="18">Loading / Disabled</text><rect x="994" y="278" width="170" height="44" rx="14" fill="#0f172a"/><text x="1032" y="306" class="ui" fill="#fff" font-size="14">处理中…</text><rect x="994" y="340" width="170" height="44" rx="14" fill="#f1f5f9"/><text x="1030" y="368" class="ui muted" font-size="14">不可用</text>
<rect x="92" y="460" width="390" height="250" rx="24" class="card"/><text x="126" y="508" class="ui title" font-size="18">空状态</text><text x="126" y="552" class="ui title" font-size="16">创建第一个工程协作运行</text><text x="126" y="582" class="ui muted" font-size="13">给 Cairn 一个目标、上下文和验收标准。</text><rect x="126" y="622" width="126" height="40" rx="13" fill="#2563eb"/><text x="158" y="647" class="ui" fill="#fff" font-size="14">新建运行</text>
<rect x="526" y="460" width="390" height="250" rx="24" class="card"/><text x="560" y="508" class="ui title" font-size="18">错误状态</text><text x="560" y="552" class="ui red" font-size="16" font-weight="760">本地 Core 没有正常启动</text><text x="560" y="582" class="ui muted" font-size="13">界面仍可打开，但暂时不能推进运行。</text><rect x="560" y="622" width="136" height="40" rx="13" fill="#dc2626"/><text x="588" y="647" class="ui" fill="#fff" font-size="14">重新启动</text><text x="718" y="647" class="ui muted" font-size="13">打开日志</text>
<rect x="960" y="460" width="390" height="250" rx="24" class="card"/><text x="994" y="508" class="ui title" font-size="18">危险确认</text><text x="994" y="552" class="ui title" font-size="16">取消这个运行？</text><text x="994" y="582" class="ui muted" font-size="13">会停止当前 Agent 运行，产物会保留。</text><rect x="994" y="622" width="90" height="40" rx="13" fill="#fff" stroke="#dbe3ef"/><text x="1024" y="647" class="ui muted" font-size="14">返回</text><rect x="1100" y="622" width="126" height="40" rx="13" fill="#dc2626"/><text x="1130" y="647" class="ui" fill="#fff" font-size="14">取消运行</text>
</svg>