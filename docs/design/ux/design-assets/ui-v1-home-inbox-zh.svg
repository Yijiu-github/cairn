<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Cairn UI Visual Reference V1 - 首页 / 待处理</title>
  <desc id="desc">Cairn 桌面端首页与待处理队列第一版视觉参考。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-weight: 760; fill: #0f172a; }
      .muted { fill: #64748b; }
      .soft { fill: #94a3b8; }
      .panel { fill: rgba(255,255,255,0.88); stroke: #dbe3ef; }
      .card { fill: #ffffff; stroke: #dbe3ef; }
      .hair { stroke: #e2e8f0; stroke-width: 1; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .amber { fill: #d97706; }
      .red { fill: #dc2626; }
      .purple { fill: #7c3aed; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <rect x="60" y="54" width="1320" height="852" rx="32" class="panel" filter="url(#shadow)"/>
  <rect x="60" y="54" width="1320" height="64" rx="32" fill="#ffffff"/>
  <rect x="60" y="86" width="1320" height="32" fill="#ffffff"/>
  <text x="96" y="94" class="ui title" font-size="22">Cairn</text>
  <text x="174" y="94" class="ui muted" font-size="14">个人桌面工作区</text>
  <rect x="510" y="72" width="420" height="32" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="536" y="93" class="ui soft" font-size="13">⌘K 搜索任务、产物、命令</text>
  <circle cx="1200" cy="88" r="7" fill="#16a34a"/>
  <text x="1218" y="93" class="ui muted" font-size="13">Core 正常 · Codex 就绪</text>

  <rect x="60" y="118" width="236" height="788" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="96" y="168" class="ui title" font-size="13">工作区</text>
  <rect x="84" y="194" width="188" height="40" rx="12" fill="#eff6ff"/>
  <text x="108" y="219" class="ui blue" font-size="15" font-weight="700">待处理</text>
  <text x="108" y="270" class="ui muted" font-size="15">运行</text>
  <text x="108" y="316" class="ui muted" font-size="15">任务</text>
  <text x="108" y="362" class="ui muted" font-size="15">产物</text>
  <text x="108" y="408" class="ui muted" font-size="15">运行时</text>
  <text x="108" y="454" class="ui muted" font-size="15">活动</text>
  <text x="108" y="500" class="ui muted" font-size="15">设置</text>
  <rect x="86" y="792" width="186" height="70" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="108" y="822" class="ui title" font-size="13">本地优先</text>
  <text x="108" y="846" class="ui muted" font-size="12">产物 stay on this Mac</text>

  <text x="344" y="176" class="ui title" font-size="34">让 Agent 做什么？</text>
  <text x="346" y="208" class="ui muted" font-size="15">创建带上下文、验收标准和证据要求的结构化运行。</text>
  <rect x="344" y="240" width="660" height="190" rx="24" class="card" filter="url(#shadow)"/>
  <text x="376" y="284" class="ui title" font-size="17">新建运行</text>
  <rect x="376" y="306" width="596" height="54" rx="16" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="400" y="340" class="ui soft" font-size="15">让 Cairn 调研、修改、验证或整理某件事…</text>
  <rect x="376" y="380" width="134" height="32" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="394" y="401" class="ui muted" font-size="12">工作目录</text>
  <rect x="522" y="380" width="124" height="32" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="540" y="401" class="ui muted" font-size="12">验收标准</text>
  <rect x="658" y="380" width="126" height="32" rx="10" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="676" y="401" class="ui muted" font-size="12">期望证据</text>
  <rect x="838" y="376" width="134" height="40" rx="13" fill="url(#brand)"/>
  <text x="872" y="401" class="ui" font-size="14" font-weight="760" fill="#ffffff">创建运行</text>

  <text x="344" y="486" class="ui title" font-size="22">待我处理</text>
  <text x="344" y="512" class="ui muted" font-size="14">这里不是通知流，而是等待人类判断的交接队列。</text>
  <rect x="344" y="536" width="318" height="166" rx="22" class="card"/>
  <rect x="374" y="566" width="36" height="36" rx="12" fill="#fef3c7"/>
  <text x="383" y="590" class="ui amber" font-size="20">!</text>
  <text x="426" y="582" class="ui title" font-size="16">批准文件写入</text>
  <text x="426" y="608" class="ui muted" font-size="13">运行阻塞 · 8 分钟 · 受保护路径</text>
  <rect x="426" y="632" width="112" height="34" rx="11" fill="#0f172a"/>
  <text x="448" y="654" class="ui" font-size="13" fill="#ffffff">仅本次批准</text>
  <text x="554" y="654" class="ui muted" font-size="13">拒绝</text>

  <rect x="686" y="536" width="318" height="166" rx="22" class="card"/>
  <rect x="716" y="566" width="36" height="36" rx="12" fill="#dcfce7"/>
  <text x="724" y="590" class="ui green" font-size="18">✓</text>
  <text x="768" y="582" class="ui title" font-size="16">审阅补丁</text>
  <text x="768" y="608" class="ui muted" font-size="13">3 项检查通过 · patch.diff</text>
  <rect x="768" y="632" width="82" height="34" rx="11" fill="#16a34a"/>
  <text x="790" y="654" class="ui" font-size="13" fill="#ffffff">接受</text>
  <text x="866" y="654" class="ui muted" font-size="13">要求修改</text>

  <rect x="1040" y="240" width="292" height="462" rx="24" class="card"/>
  <text x="1070" y="284" class="ui title" font-size="18">运行时 status</text>
  <text x="1070" y="314" class="ui muted" font-size="13">本地 Core 和 Agent 运行时是两个独立健康面。</text>
  <line x1="1070" y1="344" x2="1302" y2="344" class="hair"/>
  <text x="1070" y="382" class="ui title" font-size="14">工作区 Core</text>
  <text x="1224" y="382" class="ui green" font-size="13">正常</text>
  <text x="1070" y="424" class="ui title" font-size="14">Codex CLI</text>
  <text x="1224" y="424" class="ui green" font-size="13">就绪</text>
  <text x="1070" y="466" class="ui title" font-size="14">队列</text>
  <text x="1224" y="466" class="ui muted" font-size="13">2 个运行中</text>
  <rect x="1070" y="524" width="232" height="48" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1094" y="554" class="ui muted" font-size="13">复制脱敏状态</text>
  <rect x="1070" y="586" width="232" height="48" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1094" y="616" class="ui muted" font-size="13">打开诊断</text>

  <text x="344" y="760" class="ui title" font-size="22">最近运行</text>
  <rect x="344" y="784" width="988" height="74" rx="18" class="card"/>
  <text x="374" y="817" class="ui title" font-size="15">补充 scheduler port ADR 后续</text>
  <text x="374" y="842" class="ui muted" font-size="13">运行中 · 4 个任务 · 2 个产物 · 等待验收检查</text>
  <text x="1168" y="829" class="ui blue" font-size="13" font-weight="700">打开运行 →</text>
</svg>