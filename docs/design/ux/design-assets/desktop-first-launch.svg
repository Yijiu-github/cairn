<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Cairn First Launch Wizard Wireframe</title>
  <desc id="desc">Low fidelity first launch wizard wireframe.</desc>
  <rect width="960" height="640" fill="#eef2f7"/>
  <rect x="160" y="80" width="640" height="480" rx="24" fill="#ffffff" stroke="#cfd6df"/>
  <text x="214" y="146" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">Cairn</text>
  <text x="214" y="176" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Local-first multi-agent collaboration workspace</text>
  <text x="214" y="232" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2563eb">Step 1 of 4</text>
  <text x="214" y="262" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#111827">Choose workspace</text>
  <rect x="214" y="294" width="532" height="104" rx="14" fill="#f8fafc" stroke="#d9dde3"/>
  <text x="238" y="326" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">Workspace data directory</text>
  <rect x="238" y="342" width="380" height="34" rx="8" fill="#ffffff" stroke="#cfd6df"/>
  <text x="254" y="364" font-family="SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">/Users/you/Cairn Workspace</text>
  <rect x="630" y="342" width="92" height="34" rx="8" fill="#ffffff" stroke="#cfd6df"/>
  <text x="652" y="364" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#334155">Choose…</text>
  <text x="238" y="430" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Stores SQLite database, artifacts, logs and local config.</text>
  <rect x="214" y="492" width="92" height="36" rx="9" fill="#ffffff" stroke="#cfd6df"/>
  <text x="244" y="515" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Back</text>
  <rect x="630" y="492" width="116" height="36" rx="9" fill="#2563eb"/>
  <text x="661" y="515" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Continue</text>
</svg>
